name: Build EDK2 for SM-T550 (gt510wifi)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev iasl nasm python3 python3-distutils \
            gcc-aarch64-linux-gnu device-tree-compiler git ca-certificates

      - name: Setup environment
        run: ./setup_env.sh

      - name: Build gt510wifi
        run: ./build_gt510wifi.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-gt510wifi
          path: boot-gt510wifi.img
